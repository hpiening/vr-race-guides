[build]
  command = "npm run build"
  publish = "out"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# The old Decap CMS at /admin was replaced by the inline editor at /edit.
# Redirect any old /admin links to the editor.
[[redirects]]
  from = "/admin/*"
  to = "/edit/"
  status = 301
  force = true
