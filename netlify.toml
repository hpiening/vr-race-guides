[build]
  command = "npm run build"
  publish = "out"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# The old Decap CMS at /admin was replaced by the inline editor at /edit.
# Redirect any old /admin links to the editor.
[[redirects]]
  from = "/admin/*"
  to = "/edit/"
  status = 301
  force = true

# ─── Jump links for emails and socials ────────────────────────────────
# guides.vacationraces.com/grand-circle/courses -> the Courses section of that
# guide. `:guide` is a placeholder, so one rule covers every guide. Aliases are
# included where someone writing an email might reasonably guess differently
# (dining/meals, courses/course, explore/experiences).
# 302 rather than 301 so section ids can be renamed later without the old
# target being cached in someone's browser forever.

[[redirects]]
  from = "/:guide/schedule"
  to = "/:guide/#schedule"
  status = 302

[[redirects]]
  from = "/:guide/check-in"
  to = "/:guide/#expo"
  status = 302

