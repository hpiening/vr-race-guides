<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Race Guide Admin | Vacation Races</title>
  </head>
  <body>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      CMS.registerPreviewStyle('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=DM+Sans:wght@400;700&display=swap', { raw: false });

      CMS.registerPreviewStyle([
        'body { font-family: "DM Sans", sans-serif; margin: 0; background: #FAF7F2; color: #313832; }',
        '.hero { background: #313832; color: #f3e2cc; padding: 48px 32px; position: relative; overflow: hidden; min-height: 200px; }',
        '.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }',
        '.hero-content { position: relative; z-index: 1; }',
        '.hero-label { font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.7; margin: 0 0 8px; }',
        '.hero-name { font-family: "Oswald", sans-serif; font-size: 56px; text-transform: uppercase; line-height: 1; margin: 0 0 12px; color: #fff; }',
        '.hero-meta { font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.8; }',
        '.section { padding: 40px 32px; border-bottom: 1px solid rgba(49,56,50,0.1); }',
        '.section.dark { background: #313832; color: #f3e2cc; }',
        '.section-label { font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; opacity: 0.5; margin: 0 0 4px; }',
        '.section-title { font-family: "Oswald", sans-serif; font-size: 36px; text-transform: uppercase; margin: 0 0 24px; }',
        '.item { display: flex; gap: 16px; padding-bottom: 20px; }',
        '.dot { width: 8px; height: 8px; border-radius: 50%; background: #da8165; margin-top: 6px; flex-shrink: 0; }',
        '.item-time { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #da8165; margin: 0 0 2px; }',
        '.item-label { font-size: 16px; text-transform: uppercase; font-weight: 700; margin: 0; }',
        '.item-note { font-size: 13px; opacity: 0.6; margin: 4px 0 0; }',
        '.tabs { display: flex; gap: 0; border-bottom: 1px solid rgba(243,226,204,0.15); margin-bottom: 24px; }',
        '.tab { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; padding: 10px 20px; border-bottom: 2px solid #f3e2cc; color: #f3e2cc; }',
        '.row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(49,56,50,0.1); font-size: 14px; }',
        '.row.light-row { border-color: rgba(243,226,204,0.1); }',
        '.row-label { opacity: 0.6; }',
        '.faq-q { font-weight: 700; font-size: 15px; margin: 0 0 6px; }',
        '.faq-a { font-size: 14px; opacity: 0.75; margin: 0 0 20px; }',
        '.block { padding-bottom: 18px; }',
        '.block-h { font-weight: 700; font-size: 15px; text-transform: uppercase; margin: 0 0 6px; }',
        '.block-b { font-size: 14px; opacity: 0.8; margin: 0; white-space: pre-line; }',
        '.quote { font-family: "Fraunces", Georgia, serif; font-style: italic; font-size: 22px; line-height: 1.3; margin: 16px 0 6px; }',
        '.quote-by { font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.6; margin: 0 0 16px; }',
        '.pill { display: inline-block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; background: rgba(218,129,101,0.15); color: #da8165; padding: 3px 10px; border-radius: 999px; margin: 0 0 8px; }',
        '.off { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.4; }',
      ].join('\n'), { raw: true });

      // Helper: render a list of {heading, body} info blocks
      function blocks(items) {
        return (items || []).map(function(b, i) {
          return h('div', { key: i, className: 'block' },
            h('p', { className: 'block-h' }, b.heading),
            h('p', { className: 'block-b' }, b.body)
          );
        });
      }
      // Helper: a section heading row (label + title), with an "off" note if disabled
      function head(label, title) {
        return [
          h('p', { className: 'section-label', key: 'l' }, label),
          h('h2', { className: 'section-title', key: 't' }, title)
        ];
      }

      var EventPreview = createClass({
        render: function() {
          var e = this.props.entry;
          var d = e.get('data').toJS ? e.get('data').toJS() : {};
          var s = d.sections || {};
          var welcome = s.welcome || {};
          var schedule = s.schedule || {};
          var expo = s.expo || {};
          var courseInfo = s.courseInfo || {};
          var raceMorning = s.raceMorning || {};
          var spectators = s.spectators || {};
          var postRace = s.postRace || {};
          var challengeEvents = s.challengeEvents || {};
          var experiences = s.experiences || {};
          var faqs = s.faqs || {};

          return h('div', {},
            h('div', { className: 'hero' },
              d.heroImage && h('img', { src: d.heroImage, alt: '' }),
              h('div', { className: 'hero-content' },
                h('p', { className: 'hero-label' }, 'Race Day Guide'),
                h('h1', { className: 'hero-name' }, d.name || 'Event Name'),
                h('p', { className: 'hero-meta' }, [d.tagline, d.dates].filter(Boolean).join(' · '))
              )
            ),

            welcome.enabled && h('div', { className: 'section' },
              head('Welcome', welcome.heading || 'Welcome'),
              welcome.body && h('p', { className: 'block-b', style: { marginBottom: '12px' } }, welcome.body),
              welcome.quote && h('p', { className: 'quote' }, '“' + welcome.quote + '”'),
              welcome.quoteAttribution && h('p', { className: 'quote-by' }, '— ' + welcome.quoteAttribution),
              welcome.closing && h('p', { className: 'block-b' }, welcome.closing)
            ),

            schedule.enabled && h('div', { className: 'section dark' },
              h('p', { className: 'section-label' }, 'Schedule'),
              h('h2', { className: 'section-title' }, 'Schedule'),
              (schedule.days || []).slice(0,1).map(function(day) {
                return h('div', { key: day.id },
                  h('div', { className: 'tabs' }, h('div', { className: 'tab' }, day.label)),
                  h('p', { style: { fontSize: '11px', letterSpacing: '0.2em', textTransform: 'uppercase', opacity: 0.4, marginBottom: '16px' } }, day.date),
                  (day.items || []).map(function(item, i) {
                    return h('div', { key: i, className: 'item' },
                      h('div', { className: 'dot' }),
                      h('div', {},
                        h('p', { className: 'item-time' }, item.time),
                        h('p', { className: 'item-label' }, item.label),
                        item.note && h('p', { className: 'item-note' }, item.note)
                      )
                    );
                  })
                );
              })
            ),

            expo.enabled && h('div', { className: 'section' },
              h('p', { className: 'section-label' }, 'Pre-Race Expo'),
              h('h2', { className: 'section-title' }, 'Expo'),
              h('p', { style: { fontWeight: 700, marginBottom: '16px' } }, expo.locationName),
              (expo.hours || []).map(function(row, i) {
                return h('div', { key: i, className: 'row' },
                  h('span', { className: 'row-label' }, row.label),
                  h('span', {}, row.time)
                );
              })
            ),

            courseInfo.enabled && h('div', { className: 'section dark' },
              head(courseInfo.navLabel || 'Course Info', courseInfo.heading || courseInfo.navLabel || 'Course Info'),
              (courseInfo.distances || []).map(function(d, i) {
                return h('div', { key: i, className: 'block' },
                  h('p', { className: 'block-h' }, d.name),
                  d.stats && h('p', { className: 'block-b' }, d.stats)
                );
              }),
              blocks(courseInfo.infoBlocks)
            ),

            raceMorning.enabled && h('div', { className: 'section' },
              head(raceMorning.navLabel || 'Race Morning', raceMorning.navLabel || 'Race Morning'),
              (raceMorning.courses || []).map(function(c, i) {
                return h('div', { key: i, className: 'block' },
                  h('p', { className: 'block-h' }, c.name),
                  c.stats && h('p', { className: 'block-b' }, c.stats)
                );
              }),
              (raceMorning.shuttleDetails || []).map(function(item, i) {
                return h('div', { key: 'm' + i, className: 'row' },
                  h('span', { className: 'row-label' }, item.time),
                  h('span', {}, item.label)
                );
              }),
              blocks(raceMorning.infoBlocks)
            ),

            spectators.enabled && h('div', { className: 'section dark' },
              head('Spectators', 'Spectators'),
              spectators.notes && h('p', { className: 'block-b', style: { marginBottom: '12px' } }, spectators.notes),
              (spectators.warnings || []).map(function(w, i) {
                return h('p', { key: i, className: 'block-b', style: { marginBottom: '8px' } }, '• ' + w);
              })
            ),

            postRace.enabled && h('div', { className: 'section' },
              head('Post-Race', 'Post-Race'),
              postRace.finishLineInfo && h('p', { className: 'block-b', style: { marginBottom: '12px' } }, postRace.finishLineInfo),
              (postRace.courseRecords || []).map(function(r, i) {
                return h('div', { key: 'r' + i, className: 'row' },
                  h('span', { className: 'row-label' }, r.category),
                  h('span', {}, r.name + ' · ' + r.time + ' (' + r.year + ')')
                );
              }),
              blocks(postRace.infoSections)
            ),

            challengeEvents.enabled && h('div', { className: 'section dark' },
              head('Challenge Events', 'Challenge Events'),
              challengeEvents.intro && h('p', { className: 'block-b', style: { marginBottom: '12px' } }, challengeEvents.intro),
              (challengeEvents.events || []).map(function(ev, i) {
                return h('div', { key: i, className: 'block' },
                  h('p', { className: 'block-h' }, ev.name),
                  ev.tagline && h('p', { className: 'pill' }, ev.tagline),
                  ev.description && h('p', { className: 'block-b' }, ev.description)
                );
              })
            ),

            experiences.enabled && h('div', { className: 'section' },
              head('Experiences', 'Experiences'),
              experiences.lodging && experiences.lodging.partner && h('div', { className: 'block' },
                h('p', { className: 'block-h' }, 'Lodging — ' + experiences.lodging.partner),
                h('p', { className: 'block-b' }, experiences.lodging.description)
              ),
              ['activities', 'hikes', 'sights', 'restaurants'].map(function(key) {
                var list = experiences[key] || [];
                if (!list.length) return null;
                return h('div', { key: key, className: 'block' },
                  h('p', { className: 'block-h' }, key),
                  h('p', { className: 'block-b' }, list.map(function(x) { return x.name; }).filter(Boolean).join(' · '))
                );
              })
            ),

            faqs.enabled && (faqs.items || []).length > 0 && h('div', { className: 'section' },
              h('p', { className: 'section-label' }, 'FAQs'),
              h('h2', { className: 'section-title' }, 'FAQs'),
              (faqs.items || []).map(function(faq, i) {
                return h('div', { key: i },
                  h('p', { className: 'faq-q' }, faq.question),
                  h('p', { className: 'faq-a' }, faq.answer)
                );
              })
            )
          );
        }
      });

      CMS.registerPreviewTemplate('events', EventPreview);
    </script>
  </body>
</html>
